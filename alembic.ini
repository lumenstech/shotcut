# Alembic config for shotcut.
#
# Migrations are numbered `NNNN_description.py` and live in alembic/versions/.
# Async engine + asyncpg are configured in alembic/env.py — this file is
# static metadata only. The DB URL is read from the Settings config at
# runtime, not baked in here.

[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os
version_path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
