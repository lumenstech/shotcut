[project]
name = "shotcut"
version = "0.1.0"
description = "Multi-agent spreadsheet intelligence backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "anthropic>=0.92",
    "openpyxl>=3.1",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "edgartools>=3.0",
    "tenacity>=9.0",
    "formualizer>=0.5.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shotcut"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
# Third-party libraries without type stubs. We tolerate these at the
# wrapper boundary only; our own code stays strictly typed.
module = [
    "formualizer",
    "formualizer.*",
    "edgar",
    "edgar.*",
    "edgartools.*",
    "openpyxl",
    "openpyxl.*",
]
ignore_missing_imports = true
